<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Photo, Two Moods</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
<main>
    <h1>Black & White Photo</h1>
    
    <div class="gallery">
        <button class="arrow" id="previous" aria-label="Previous photo">&lt;</button>
        <div class="photo-frame">
            <img id="photo" src="images/photo1.jpg" alt="Photograph in the gallery">
        </div>
        <button class="arrow" id="next" aria-label="Next photo">&gt;</button>
    </div>

    <button id="colorButton">Show Color</button>
    <p id="counter">1 / 6</p>
</main>
</body>
</html>
